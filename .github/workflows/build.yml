name: Build NextUp3 (roothide)

# Only build the dev branch. Pushing artifacts to ci-artifacts will NOT retrigger
# this workflow (ci-artifacts is excluded), avoiding a publish->build loop.
permissions:
  contents: write   # needed to force-push the .deb / build.log to ci-artifacts

on:
  push:
    branches: ["cn-ntease"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: "${{ github.workspace }}/theos"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install dpkg ldid

      # Clone + build in ONE step so build.log always captures the failure,
      # even if the theos clone itself fails.
      - name: Clone Theos + SDK and build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          set -x
          echo "== cloning theos =="
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk
          echo "== building =="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "ci@local"
          git config user.name "CI"
          mkdir -p artifacts
          if [ -f build.log ]; then cp build.log artifacts/ci-last-build.log; fi
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb artifacts/NextUp3.deb; fi
          if [ -f artifacts/ci-last-build.log ] || ls artifacts/*.deb >/dev/null 2>&1; then
            # .gitignore contains "*.deb", so force-add the published .deb or it
            # gets silently skipped and never reaches ci-artifacts.
            git add -A -f artifacts
            git commit -m "ci artifacts (${{ github.sha }})" || echo "nothing to commit"
            git push --force https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:ci-artifacts
          else
            echo "no artifacts produced; nothing to publish"
          fi

      # Make the job conclusion reflect reality: the build step uses
      # continue-on-error so it always emits a log, but if no .deb came out the
      # build actually failed and we must fail the run.
      - name: Verify .deb produced
        if: always()
        run: |
          if ls packages/*.deb >/dev/null 2>&1; then
            echo "BUILD OK: $(ls packages/*.deb)"
          else
            echo "BUILD FAILED: no .deb in packages/"
            exit 1
          fi
