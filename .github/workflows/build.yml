name: Build NextUp3 (roothide)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: "${{ github.workspace }}/theos"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: brew install dpkg ldid

      - name: Clone Theos + SDK
        run: |
          set -e
          # Mainline theos supports THEOS_PACKAGE_SCHEME=roothide natively; the
          # roothide fork's recursive toolchain submodule is flaky to clone on CI.
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk

      - name: Build package (roothide)
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log

      - name: Publish result to public release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete ci-build --yes || true
          git push --delete origin ci-build || true
          if ls packages/*.deb >/dev/null 2>&1; then
            gh release create ci-build packages/*.deb \
              --title "NextUp3 roothide CI build (${{ github.ref_name }})" \
              --notes "Automated roothide .deb from push to ${{ github.ref_name }}." \
              --prerelease
          else
            gh release create ci-build build.log \
              --title "NextUp3 CI build FAILED (${{ github.ref_name }})" \
              --notes "Build failed. See the build.log asset for the error." \
              --prerelease
          fi
